<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="logoTitle">
  <title id="logoTitle">Food &amp; Coffee</title>

  <defs>
    <clipPath id="badge">
      <circle cx="120" cy="120" r="108"/>
    </clipPath>
  </defs>

  <!-- Blason aplati : fond transparent, seul le disque est peint -->
  <g clip-path="url(#badge)">
    <rect width="240" height="240" fill="#4b5e3f"/>
    <polygon points="240,0 240,240 0,240" fill="#6b4226"/>
  </g>

  <circle cx="120" cy="120" r="108" fill="none" stroke="#c99a3e" stroke-width="3.6"/>

  <g font-family="Montserrat, 'Helvetica Neue', Arial, sans-serif" font-weight="800" text-anchor="middle">
    <text x="120" y="113" font-size="32" letter-spacing="1.8" fill="#f0c24b">FOOD</text>
    <line x1="91" y1="126" x2="149" y2="126" stroke="#f0c24b" stroke-width="1.8"/>
    <text x="120" y="154" font-size="32" letter-spacing="1.8" fill="#f0c24b">COFFEE</text>
  </g>
</svg>
